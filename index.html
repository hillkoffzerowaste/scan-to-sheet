<!doctype html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#058581" />
    <meta name="description" content="Scan parcel labels into daily Google Sheets by courier." />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="/icons/icon.svg" />
    <link rel="apple-touch-icon" href="/icons/icon.svg" />
    <script>
      (() => {
        let theme = 'light';
        try {
          theme = localStorage.getItem('scan-to-sheet-theme') === 'dark' ? 'dark' : 'light';
        } catch {
          // Storage can be unavailable in privacy-restricted browser contexts.
        }
        document.documentElement.dataset.theme = theme;
        document.documentElement.style.colorScheme = theme;
      })();
    </script>
    <title>HILLKOFF Scan to Sheet</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
